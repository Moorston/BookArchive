name: 自动更新目录
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成目录树
        uses: RavelloH/readme-tree@v1.1.0
        with:
          # 要生成目录的路径，根目录用 "."
          base_path: "."
          # 最大目录深度
          max_depth: 3
          # 排除的文件和文件夹
          exclude: ".git,.github,.gitignore,.gitattributes"
          # 是否显示文件
          show_files: true
          # 是否显示文件夹
          show_dirs: true

      - name: 提交更改
        run: |
          git config --global user.name "Moonston"
          git config --global user.email "2339043277@qq.com"
          git add README.md
          if git diff-index --quiet HEAD --; then
            echo "没有更改需要提交"
          else
            git commit -m "自动更新目录"
            git push
          fi
